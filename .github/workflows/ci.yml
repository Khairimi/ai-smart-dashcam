name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to the version used for local development (flutter doctor: 3.47.9).
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.9
          cache: true

      - run: flutter --version
      - run: flutter pub get
      - run: flutter analyze
      - name: flutter test
        shell: bash
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee test.log
      # Diagnostics only: republish failing-test output as annotations so it is
      # readable without admin access to the raw logs. Does not change results.
      - name: Annotate test failures
        if: failure()
        run: python3 tool/annotate_test_failures.py test.log
      - run: flutter build web --release
